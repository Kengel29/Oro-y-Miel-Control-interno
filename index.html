<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oro y Miel · Control interno</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4ec;--card:#fffdfb;--ink:#3b1f16;--mut:#8a6b60;--pink:#d9628a;--pinkl:#f9dfe7;--honey:#d99a1c;--ok:#2f8f5b;--bad:#c0392b;--line:#f0d9d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark;--bg:#241511;--card:#33201a;--ink:#fbeee6;--mut:#c4a498;--pinkl:#4d2633;--line:#4a2f27;--pink:#ef7ea1}
.tm{margin-left:auto;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:8px 12px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:600 15px/1.45 Quicksand,system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border-bottom:2px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header img{width:52px;height:52px;border-radius:50%}
header h1{font:700 28px 'Dancing Script',cursive;margin:0;line-height:1}header small{color:var(--mut)}
nav{display:flex;gap:6px;padding:10px 12px;max-width:1000px;margin:auto}
nav button{flex:1;padding:11px 6px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;font:inherit;font-weight:700;cursor:pointer}
nav button.on{background:var(--pink);border-color:var(--pink);color:#fff}
main{max-width:1000px;margin:auto;padding:0 12px 40px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
h2{font:700 22px 'Dancing Script',cursive;margin:0 0 8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px}
.stat span{color:var(--mut);font-size:13px;display:block}.stat b{font-size:20px}
.stat.g b{color:var(--ok)}
.pos{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}@media(max-width:760px){.pos{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.prod{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:10px;text-align:left;font:inherit;cursor:pointer;min-height:84px}
.prod:active{transform:scale(.97)}.prod b{display:block}.prod span{color:var(--pink);font-weight:700}.prod small{display:block;color:var(--mut)}.prod.low small{color:var(--bad)}
button.btn{background:var(--pink);color:#fff;border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}
button.btn.alt{background:var(--honey)}button.btn.ghost{background:var(--pinkl);color:var(--ink)}button.btn.red{background:var(--bad)}button.btn.sm{padding:6px 10px;font-size:13px}
input,select{font:inherit;font-weight:600;padding:9px 10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
label{font-size:12px;color:var(--mut);display:block}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cart div.it{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px dashed var(--line)}
.cart .it .n{flex:1}.q{width:30px;height:30px;border-radius:50%;border:0;background:var(--pinkl);color:var(--ink);font-weight:700;font-size:16px;cursor:pointer}
.total{font-size:24px;font-weight:700;margin:10px 0}
.inv{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}@media(max-width:600px){.inv{grid-template-columns:1fr 1fr}.inv .nm{grid-column:1/-1}}
.mg{margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--mut)}.mg b{color:var(--ok)}.mg b.neg{color:var(--bad)}
.tag{padding:3px 9px;border-radius:99px;background:var(--pinkl);font-size:12px}
table{width:100%;border-collapse:collapse}th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);font-size:14px}th:first-child,td:first-child{text-align:left}
.sc{overflow-x:auto}.mut{color:var(--mut)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:9}#toast.on{opacity:1}
</style></head><body>

<nav id="nav"></nav><main id="app"></main><div id="printArea"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const money=n=>'RD$'+(Math.round((+n||0)*100)/100).toLocaleString('es-DO',{maximumFractionDigits:2});
const today=()=>new Date().toLocaleDateString('en-CA');
const pretty=k=>{const[y,m,d]=k.split('-');return d+'/'+m+'/'+y};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D,tab='caja',cart=[],range='hoy';
const seed=()=>({products:[['Marquesa de Limón',100],['Tres Leches de Chocolate',125],['Tres Leches de Vainilla',100],['Delicioso Flan',175],['Marquesa de Chinola',125],['Cupcakes Mix (unidad)',50]].map((p,i)=>({id:'p'+i,name:p[0],price:p[1],cost:0,stock:0,min:3})),days:{},nid:10});
try{D=JSON.parse(localStorage.getItem('oroymiel1'))}catch(e){}
if(!D||!D.products)D=seed();
const save=()=>{try{localStorage.setItem('oroymiel1',JSON.stringify(D))}catch(e){}};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
const openKey=()=>Object.keys(D.days).find(k=>!D.days[k].closed);
const curKey=()=>openKey()||today();
const tot=d=>{let v=0,c=0,cash=0;(d.sales||[]).forEach(s=>{v+=s.total;c+=s.cost;if(s.method==='Efectivo')cash+=s.total});return{v,c,g:v-c,cash,n:(d.sales||[]).length}};

function nav(){const t=[['caja','Caja'],['inv','Inventario'],['rep','Reportes']];
$('#nav').innerHTML=t.map(x=>`<button class="${tab===x[0]?'on':''}" onclick="tab='${x[0]}';render()">${x[1]}</button>`).join('')}

function render(){nav();$('#app').innerHTML=tab==='caja'?caja():tab==='inv'?inv():rep()}

/* ---------- CAJA ---------- */
function caja(){const k=curKey(),d=D.days[k];
if(!d)return `<div class="card"><h2>Abrir caja de hoy</h2><p class="mut">${pretty(k)} · Indica el efectivo con que empiezas el día.</p><label>Fondo inicial (efectivo)</label><input id="fondo" type="number" inputmode="decimal" value="0"><br><br><button class="btn" onclick="abrir()">Abrir caja</button></div>`;
const t=tot(d),esp=d.fondo+t.cash;
let h=(k!==today()&&!d.closed?`<div class="card" style="border-color:var(--bad)">Esta caja es del ${pretty(k)} y sigue abierta. Ciérrala para empezar un nuevo día.</div>`:'')+
`<div class="row" style="margin-bottom:10px"><h2 style="margin:0">Caja del ${pretty(k)}</h2><span class="tag">${d.closed?'Cerrada':'Abierta'}</span></div>
<div class="stats"><div class="stat"><span>Ventas del día</span><b>${money(t.v)}</b></div><div class="stat g"><span>Ganancia</span><b>${money(t.g)}</b></div><div class="stat"><span>Nº de ventas</span><b>${t.n}</b></div><div class="stat"><span>Efectivo esperado</span><b>${money(esp)}</b></div></div>`;
if(!d.closed){
h+=`<div class="pos"><div class="card"><h2>Productos</h2><div class="grid">${D.products.map(p=>`<button class="prod ${p.stock<=p.min?'low':''}" onclick="add('${p.id}')"><b>${esc(p.name)}</b><span>${money(p.price)}</span><small>Quedan: ${p.stock}</small></button>`).join('')}</div></div>
<div class="card cart"><h2>Venta actual</h2>${cart.length?cart.map(c=>{const p=D.products.find(x=>x.id===c.id);return `<div class="it"><span class="n">${esc(p.name)}<br><small class="mut">${money(p.price)}</small></span><button class="q" onclick="qty('${c.id}',-1)">−</button><b>${c.q}</b><button class="q" onclick="qty('${c.id}',1)">+</button></div>`}).join(''):'<p class="mut">Toca un producto para agregarlo.</p>'}
<div class="total">Total: ${money(cart.reduce((s,c)=>s+c.q*D.products.find(x=>x.id===c.id).price,0))}</div>
<label>Forma de pago</label><select id="pay"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option></select><br><div class="row"><button class="btn" onclick="cobrar()">Cobrar</button><button class="btn ghost" onclick="cart=[];render()">Vaciar</button></div></div></div>`;
}
h+=`<div class="card"><h2>Ventas de hoy</h2>${d.sales.length?`<div class="sc"><table><tr><th>Hora</th><th>Detalle</th><th>Pago</th><th>Total</th>${d.closed?'':'<th></th>'}</tr>${d.sales.slice().reverse().map(s=>`<tr><td>${s.time}</td><td style="text-align:left">${s.items.map(i=>i.q+'× '+esc(i.name)).join(', ')}</td><td>${s.method}</td><td>${money(s.total)}</td>${d.closed?'':`<td><button class="btn sm red" onclick="anular(${s.id})">Anular</button></td>`}</tr>`).join('')}</table></div>`:'<p class="mut">Aún no hay ventas.</p>'}</div>`;
if(!d.closed)h+=`<div class="card"><h2>Cierre de caja</h2><p class="mut">Efectivo esperado: <b>${money(esp)}</b> (fondo ${money(d.fondo)} + ventas en efectivo ${money(t.cash)})</p><label>Efectivo contado en caja</label><input id="cont" type="number" inputmode="decimal" oninput="dif(${esp})"><p id="dif" class="mut"></p><button class="btn alt" onclick="cerrar(${esp})">Cerrar caja del día</button></div>`;
else h+=`<div class="card"><h2>Resumen del cierre</h2><p>Contado: <b>${money(d.counted)}</b> · Esperado: <b>${money(d.expected)}</b> · Diferencia: <b style="color:${d.counted-d.expected<0?'var(--bad)':'var(--ok)'}">${money(d.counted-d.expected)}</b></p><button class="btn ghost" onclick="reabrir()">Reabrir caja</button></div>`;
h+=exportCard(k);return h}
function abrir(){D.days[today()]={fondo:+$('#fondo').value||0,sales:[],closed:false};save();render();toast('Caja abierta')}
function add(id){const p=D.products.find(x=>x.id===id),c=cart.find(x=>x.id===id);const have=c?c.q:0;if(have+1>p.stock){toast('Sin existencias de '+p.name+'. Agrégalas en Inventario.');return}c?c.q++:cart.push({id,q:1});render()}
function qty(id,n){const c=cart.find(x=>x.id===id),p=D.products.find(x=>x.id===id);if(n>0&&c.q+1>p.stock){toast('No hay más existencias');return}c.q+=n;if(c.q<=0)cart=cart.filter(x=>x!==c);render()}
function cobrar(){if(!cart.length){toast('Agrega productos a la venta');return}const d=D.days[curKey()];let total=0,cost=0;
const items=cart.map(c=>{const p=D.products.find(x=>x.id===c.id);p.stock-=c.q;total+=c.q*p.price;cost+=c.q*p.cost;return{id:p.id,name:p.name,q:c.q,price:p.price,cost:p.cost}});
d.sales.push({id:D.nid++,time:new Date().toLocaleTimeString('es-DO',{hour:'2-digit',minute:'2-digit'}),items,total,cost,method:$('#pay').value});cart=[];save();render();toast('Venta registrada: '+money(total))}
function anular(id){if(!confirm('¿Anular esta venta? Los productos vuelven al inventario.'))return;const d=D.days[curKey()],s=d.sales.find(x=>x.id===id);s.items.forEach(i=>{const p=D.products.find(x=>x.id===i.id);if(p)p.stock+=i.q});d.sales=d.sales.filter(x=>x!==s);save();render()}
function dif(e){const v=$('#cont').value;$('#dif').textContent=v===''?'':'Diferencia: '+money(v-e)}
function cerrar(e){const v=$('#cont').value;if(v===''){toast('Escribe el efectivo contado');return}if(!confirm('¿Cerrar la caja del día?'))return;const d=D.days[curKey()];d.closed=true;d.counted=+v;d.expected=e;save();render();toast('Caja cerrada')}
function reabrir(){D.days[curKey()].closed=false;save();render()}

/* ---------- INVENTARIO ---------- */
function inv(){const val=D.products.reduce((s,p)=>s+p.stock*p.cost,0),pot=D.products.reduce((s,p)=>s+p.stock*(p.price-p.cost),0);
return `<div class="stats"><div class="stat"><span>Valor del inventario (costo)</span><b>${money(val)}</b></div><div class="stat g"><span>Ganancia potencial</span><b>${money(pot)}</b></div></div>
<p class="mut">Escribe el costo de cada producto y el margen se calcula solo. Los cambios se guardan al salir de la casilla.</p>`+
D.products.map(p=>{const g=p.price-p.cost,m=p.price?g/p.price*100:0;return `<div class="card"><div class="inv"><div class="nm"><label>Producto</label><input value="${esc(p.name)}" onchange="upd('${p.id}','name',this.value)"></div>
<div><label>Precio venta</label><input type="number" inputmode="decimal" value="${p.price}" onchange="upd('${p.id}','price',this.value)"></div>
<div><label>Costo</label><input type="number" inputmode="decimal" value="${p.cost}" onchange="upd('${p.id}','cost',this.value)"></div>
<div><label>Existencias</label><input type="number" value="${p.stock}" onchange="upd('${p.id}','stock',this.value)"></div></div>
<div class="mg"><span>Ganancia: <b class="${g<0?'neg':''}">${money(g)}</b></span><span>Margen: <b class="${g<0?'neg':''}">${m.toFixed(1)}%</b></span>${p.stock<=p.min?'<span class="tag" style="color:var(--bad)">Poco stock</span>':''}<span style="flex:1"></span><button class="btn sm ghost" onclick="entrada('${p.id}')">+ Entrada</button><button class="btn sm red" onclick="del('${p.id}')">Eliminar</button></div></div>`}).join('')+
`<div class="card"><h2>Nuevo producto</h2><div class="inv"><div class="nm"><label>Nombre</label><input id="nn"></div><div><label>Precio</label><input id="np" type="number" inputmode="decimal"></div><div><label>Costo</label><input id="nc" type="number" inputmode="decimal"></div><div><label>Existencias</label><input id="ns" type="number"></div></div><br><button class="btn" onclick="nuevo()">Agregar producto</button></div>`}
function upd(id,f,v){const p=D.products.find(x=>x.id===id);p[f]=f==='name'?v:(+v||0);save();render()}
function entrada(id){const n=+prompt('¿Cuántas unidades entraron?');if(n>0){D.products.find(x=>x.id===id).stock+=n;save();render();toast('Existencias actualizadas')}}
function del(id){if(confirm('¿Eliminar este producto?')){D.products=D.products.filter(x=>x.id!==id);save();render()}}
function nuevo(){const n=$('#nn').value.trim();if(!n){toast('Escribe el nombre del producto');return}D.products.push({id:'p'+D.nid++,name:n,price:+$('#np').value||0,cost:+$('#nc').value||0,stock:+$('#ns').value||0,min:3});save();render()}

/* ---------- REPORTES ---------- */
function rep(){const t=today(),ks=Object.keys(D.days).sort().reverse().filter(k=>{const diff=(new Date(t)-new Date(k))/864e5;return range==='hoy'?k===t:range==='7'?diff<7:range==='30'?diff<30:true});
let V=0,C=0,N=0;const top={};ks.forEach(k=>{const d=D.days[k],x=tot(d);V+=x.v;C+=x.c;N+=x.n;d.sales.forEach(s=>s.items.forEach(i=>{top[i.name]=top[i.name]||{q:0,v:0};top[i.name].q+=i.q;top[i.name].v+=i.q*i.price}))});
const tp=Object.entries(top).sort((a,b)=>b[1].q-a[1].q);
return `<div class="card"><label>Período</label><select onchange="range=this.value;render()">${[['hoy','Hoy'],['7','Últimos 7 días'],['30','Últimos 30 días'],['todo','Todo']].map(o=>`<option value="${o[0]}" ${range===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>
<div class="stats"><div class="stat"><span>Ventas</span><b>${money(V)}</b></div><div class="stat"><span>Costo</span><b>${money(C)}</b></div><div class="stat g"><span>Ganancia</span><b>${money(V-C)}</b></div><div class="stat g"><span>Margen</span><b>${V?((V-C)/V*100).toFixed(1):0}%</b></div></div>
<div class="card"><div class="row"><h2>Por día</h2>${ks.length?`<button class="btn sm alt" onclick="csv('${ks.join(',')}')">Descargar período (CSV)</button>`:''}</div>${ks.length?`<div class="sc"><table><tr><th>Fecha</th><th>Ventas</th><th>Ganancia</th><th>Estado</th><th></th></tr>${ks.map(k=>{const d=D.days[k],x=tot(d);return `<tr><td>${pretty(k)}</td><td>${money(x.v)}</td><td>${money(x.g)}</td><td>${d.closed?'Cerrada':'Abierta'}</td><td style="white-space:nowrap"><button class="btn sm ghost" onclick="imprimir('${k}')">Imprimir</button> <button class="btn sm ghost" onclick="csv('${k}')">CSV</button></td></tr>`}).join('')}</table></div>`:'<p class="mut">No hay ventas en este período.</p>'}</div>
<div class="card"><h2>Más vendidos</h2>${tp.length?`<div class="sc"><table><tr><th>Producto</th><th>Unidades</th><th>Total</th></tr>${tp.map(x=>`<tr><td>${esc(x[0])}</td><td>${x[1].q}</td><td>${money(x[1].v)}</td></tr>`).join('')}</table></div>`:'<p class="mut">Sin datos todavía.</p>'}</div>
<div class="card"><h2>Respaldo</h2><p class="mut">Los datos se guardan en este dispositivo. Copia el respaldo para guardarlo o pasarlo a otro equipo.</p><div class="row"><button class="btn ghost" onclick="navigator.clipboard.writeText(JSON.stringify(D)).then(()=>toast('Respaldo copiado'),()=>toast('No se pudo copiar'))">Copiar respaldo</button><button class="btn ghost" onclick="restaurar()">Restaurar respaldo</button></div></div>`}
function restaurar(){const t=prompt('Pega aquí el respaldo copiado:');if(!t)return;try{const o=JSON.parse(t);if(!o.products)throw 0;D=o;save();render();toast('Respaldo restaurado')}catch(e){toast('El respaldo no es válido')}}
/* ---------- EXPORTAR / IMPRIMIR ---------- */
const RCSS='.rp{font:14px/1.4 system-ui,sans-serif;color:#222;max-width:720px;margin:0 auto;padding:16px}.rp h1{font-size:20px;margin:0}.rp .rh{display:flex;gap:12px;align-items:center;border-bottom:2px solid #d9628a;padding-bottom:8px;margin-bottom:10px}.rp img{width:60px;height:60px;border-radius:50%}.rp h3{margin:14px 0 4px;font-size:15px}.rp table{width:100%;border-collapse:collapse}.rp td,.rp th{padding:4px 6px;border-bottom:1px solid #ddd;text-align:right}.rp td:first-child,.rp th:first-child{text-align:left}.rp .sig{margin-top:44px;display:flex;gap:40px}.rp .sig div{flex:1;border-top:1px solid #000;padding-top:4px;text-align:center}.np{text-align:center}@media print{.np{display:none}}';
document.head.insertAdjacentHTML('beforeend','<style>'+RCSS+'#printArea{display:none}@media print{body>*:not(#printArea){display:none!important}#printArea{display:block}body{background:#fff}}</style>');
function exportCard(k){const d=D.days[k];if(!d||!d.sales.length)return '';return `<div class="card"><h2>Exportar el día</h2><p class="mut">${d.closed?'':'La caja sigue abierta; el reporte mostrará lo vendido hasta ahora. '}Imprime o descarga la información del ${pretty(k)}.</p><div class="row" style="justify-content:flex-start"><button class="btn" onclick="imprimir('${k}')">Imprimir</button><button class="btn alt" onclick="descargarRpt('${k}')">Descargar reporte</button><button class="btn ghost" onclick="csv('${k}')">Descargar Excel (CSV)</button></div></div>`}
function rpt(k){const d=D.days[k],t=tot(d),by={},pr={};d.sales.forEach(s=>{by[s.method]=(by[s.method]||0)+s.total;s.items.forEach(i=>{pr[i.name]=pr[i.name]||{q:0,v:0};pr[i.name].q+=i.q;pr[i.name].v+=i.q*i.price})});
const r=(a,b)=>`<tr><td>${a}</td><td>${b}</td></tr>`;
return `<div class="rp"><div class="rh"><img src="${document.querySelector('header img').src}" alt=""><div><h1>Oro y Miel · Cierre de caja</h1><div>Fecha: ${pretty(k)} · ${d.closed?'Caja cerrada':'Caja sin cerrar'}</div></div></div>
<h3>Resumen</h3><table>${r('Fondo inicial',money(d.fondo))}${r('Número de ventas',t.n)}${r('Ventas totales',money(t.v))}${r('Costo de lo vendido',money(t.c))}${r('Ganancia',money(t.g))}</table>
<h3>Por forma de pago</h3><table>${Object.entries(by).map(x=>r(x[0],money(x[1]))).join('')||r('Sin ventas','')}</table>
<h3>Por producto</h3><table><tr><th>Producto</th><th>Cant.</th><th>Total</th></tr>${Object.entries(pr).map(x=>`<tr><td>${esc(x[0])}</td><td>${x[1].q}</td><td>${money(x[1].v)}</td></tr>`).join('')}</table>
<h3>Detalle de ventas</h3><table><tr><th>Hora</th><th>Detalle</th><th>Pago</th><th>Total</th></tr>${d.sales.map(s=>`<tr><td>${s.time}</td><td style="text-align:left">${s.items.map(i=>i.q+'× '+esc(i.name)).join(', ')}</td><td>${s.method}</td><td>${money(s.total)}</td></tr>`).join('')}</table>
<h3>Cierre de efectivo</h3>${d.closed?`<table>${r('Efectivo esperado',money(d.expected))}${r('Efectivo contado',money(d.counted))}${r('Diferencia',money(d.counted-d.expected))}</table>`:'<p>Pendiente de cierre.</p>'}
<div class="sig"><div>Responsable</div><div>Revisado por</div></div></div>`}
function imprimir(k){$('#printArea').innerHTML=rpt(k);try{window.print()}catch(e){toast('Imprimir no está disponible aquí. Usa Descargar reporte.')}}
function guardar(filename,data){try{const type=filename.endsWith('.csv')?'text/csv;charset=utf-8':'text/html;charset=utf-8';const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}catch(e){toast('No se pudo descargar el archivo')}}
function descargarRpt(k){guardar('oro-y-miel-cierre-'+k+'.html','<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cierre '+pretty(k)+'</title><style>'+RCSS+'</style></head><body>'+rpt(k)+'<p class="np"><button onclick="print()">Imprimir</button></p></body></html>')}
function csv(str){const ks=str.split(',').filter(Boolean).sort(),q=v=>typeof v==='number'?v:'"'+String(v).replace(/"/g,'""')+'"';let V=0,C=0;const r=[['Fecha','Hora','Producto','Cantidad','Precio','Costo unitario','Total','Ganancia','Pago']];
ks.forEach(k=>D.days[k].sales.forEach(s=>s.items.forEach(i=>{r.push([pretty(k),s.time,i.name,i.q,i.price,i.cost,i.q*i.price,i.q*(i.price-i.cost),s.method]);V+=i.q*i.price;C+=i.q*i.cost})));
r.push([]);r.push(['TOTAL ventas','','','','','',V]);r.push(['TOTAL ganancia','','','','','',V-C]);
ks.forEach(k=>{const d=D.days[k];if(d.closed)r.push(['Cierre '+pretty(k),'Fondo',d.fondo,'Esperado',d.expected,'Contado',d.counted,'Diferencia',d.counted-d.expected])});
guardar('oro-y-miel-'+(ks.length===1?ks[0]:'reporte')+'.csv','\ufeff'+r.map(x=>x.map(q).join(',')).join('\r\n'))}
function aplicarTema(t){document.documentElement.setAttribute('data-theme',t);$('#tm').textContent=t==='dark'?'☀️ Claro':'🌙 Oscuro'}
function tema(){const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';aplicarTema(t);try{localStorage.setItem('oroymiel_tema',t)}catch(e){}}
let _t='light';try{_t=localStorage.getItem('oroymiel_tema')||'light'}catch(e){}
aplicarTema(_t);
render();
</script></body></html>
